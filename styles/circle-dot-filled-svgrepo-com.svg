<?xml version="1.0" encoding="utf-8"?>
<svg
    xmlns="http://www.w3.org/2000/svg"
    width="1000px"
    height="1000px"
    viewBox="-1 -1 18 18">

    <defs>
        <linearGradient
            id="gradient"
            x1="0%"
            y1="0%"
            x2="100%"
            y2="100%">
            <stop
                offset="0%"
                stop-color="#C1121F"/>
            <stop
                offset="100%"
                stop-color="#00A651"/>
        </linearGradient>
    </defs>

    <circle
        cx="8"
        cy="8"
        r="7"
        fill="url(#gradient)"
        stroke="#000000"
        stroke-width="0.05"/>

    <circle
        cx="8"
        cy="8"
        r="3.5"
        fill="white"
        stroke=".5"/>

</svg>